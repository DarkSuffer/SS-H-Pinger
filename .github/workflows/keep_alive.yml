name: Replit 24-7 Hard Bypass
on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual start

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Execute Ghost Browser Visit
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();
            console.log('Navigating to SS-H API...');
            try {
              await page.goto('https://35b65751-5dd2-41c5-9576-99c02a424b61-00-i88keg9i38gh.pike.replit.dev/pinger', { 
                waitUntil: 'networkidle',
                timeout: 60000 
              });
              console.log('Success: Connection Established.');
              const content = await page.content();
              if (content.includes('Heartbeat')) {
                console.log('Verification: API responded correctly.');
              }
            } catch (err) {
              console.error('Error during bypass:', err.message);
            }
            await browser.close();
          })();"
