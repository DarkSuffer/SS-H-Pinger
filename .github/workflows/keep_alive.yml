name: Render 24-7 Hard Bypass
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Engine
        run: |
          npm init -y
          npm install playwright-chromium
          npx playwright install chromium --with-deps

      - name: Execute Visit
        run: |
          node -e "
          const { chromium } = require('playwright-chromium');
          (async () => {
            console.log('--- SENDING RENDER KEEP-ALIVE PULSE ---');
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            
            // YOUR LIVE RENDER URL
            const targetUrl = 'https://ss-h-bot.onrender.com';
            
            try {
              const response = await page.goto(targetUrl, { waitUntil: 'networkidle', timeout: 60000 });
              console.log('HTTP Status:', response.status());
            } catch (err) {
              console.error('Ping Error:', err.message);
            } finally {
              await browser.close();
            }
          })();"
