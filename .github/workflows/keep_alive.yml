name: Replit Keep Alive
on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch: # Allows you to start it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiting Replit with Browser Headers
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
          -H "Upgrade-Insecure-Requests: 1" \
          -L "https://35b65751-5dd2-41c5-9576-99c02a424b61-00-i88keg9i38gh.pike.replit.dev:8080/pinger"
