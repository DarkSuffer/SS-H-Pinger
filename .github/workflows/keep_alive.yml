name: Render 24-7 Keep-Alive
on:
  schedule:
    - cron: '*/10 * * * *' # Triggers every 10 minutes
  workflow_dispatch: # Allows manual run button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright-chromium
          npx playwright install chromium --with-deps

      - name: Send Keep-Alive Pulse
        run: |
          node -e "
          const { chromium } = require('playwright-chromium');
          (async () => {
            console.log('--- STARTING KEEP-ALIVE PULSE ---');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            // PASTE YOUR ACTUAL RENDER URL HERE
            const targetUrl = 'https://ss-h-bot.onrender.com';
            
            console.log('Visiting: ' + targetUrl);
            try {
              const res = await page.goto(targetUrl, { waitUntil: 'networkidle', timeout: 60000 });
              console.log('Response Status:', res.status());
            } catch (err) {
              console.error('Pulse Failed:', err.message);
            } finally {
              await browser.close();
              console.log('--- PULSE COMPLETED ---');
            }
          })();"
